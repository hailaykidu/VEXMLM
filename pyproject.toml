[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vexmlm"
version = "1.0.0"
description = "Vocabulary-Extended XLM-R for Amharic and Tigrinya"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Hailay Teklehaymanot", email = "hailay.kidu@mu.edu.et" },
]
keywords = ["nlp", "xlm-roberta", "amharic", "tigrinya", "geez",
            "vocabulary-expansion", "low-resource", "african-languages"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "datasets>=2.14",
    "sentencepiece>=0.1.99",
    "protobuf>=3.20",
    "scikit-learn>=1.3",
    "seqeval>=1.2.2",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "accelerate>=0.26",
    "safetensors>=0.4",
]

[project.optional-dependencies]
tracking = ["mlflow>=2.9"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.3"]
all = ["mlflow>=2.9", "pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.3"]

[project.urls]
Repository = "https://github.com/hailaykidu/VEXMLM"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "vocabulary_expansion", "tokenizer", "evaluation", "datasets"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 95
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
